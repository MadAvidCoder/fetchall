[package]
name = "fetchall"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false, features = ["windows-sys"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
git2 = "0.21.0"
hostname = "0.4.2"
indoc = "2.0.8"
itertools = "0.15.0"
keyring = "4.2.0"
open = "5.4.5"
owo-colors = "4.3.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
terminal_size = "0.4.4"
tiny_http = "0.12.0"
toml = "1.1.8"
unicode-width = "0.2.2"
